<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><rect width="1200" height="330" rx="24" fill="#101828"/><text x="45" y="65" fill="#b8e3ff" font-family="monospace" font-size="32">debrief-P02.txt</text><text x="45" y="120" fill="white" font-family="monospace" font-size="27">The beeping made it really hard to concentrate.</text><text x="45" y="165" fill="white" font-family="monospace" font-size="27">I was fine for the first few but somewhere in the middle</text><text x="45" y="210" fill="white" font-family="monospace" font-size="27">I lost the thread and I think I just guessed on one of them.</text><text x="45" y="255" fill="white" font-family="monospace" font-size="27">Felt slower than I actually wanted to be.</text></svg>
